name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        run: |
          mkdir -p www
          cat > package.json <<'EOF'
          {
            "name": "barra-salon",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.1.0",
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/filesystem": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.salon.barra",
            "appName": "Barra Salon",
            "webDir": "www"
          }
          EOF
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Barra del salón</title>
          <style>
          :root{--bg:#EEF1F5;--card:#fff;--ink:#12202F;--mut:#5d6b7a;--line:#d5dce4;--acc:#E8A33D;--accink:#12202F;--bad:#b3261e;--ok:#1f7a4d;
          box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#18222f;--ink:#e8edf3;--mut:#93a1b0;--line:#2a3746;--bad:#ff8a80;--ok:#6fd3a0}}
          :root[data-theme="dark"]{--bg:#0f1620;--card:#18222f;--ink:#e8edf3;--mut:#93a1b0;--line:#2a3746;--bad:#ff8a80;--ok:#6fd3a0}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,sans-serif}
          header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;padding:12px 14px 0}
          header h1{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:.2px}
          nav{display:flex;gap:4px}
          nav button{flex:1;background:none;border:0;color:#b8c4d0;padding:10px 4px;font:600 15px Archivo,sans-serif;border-bottom:3px solid transparent}
          nav button.on{color:#fff;border-bottom-color:var(--acc)}
          main{padding:14px;max-width:640px;margin:0 auto}
          .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
          h2{font-size:18px;margin:0 0 10px;font-weight:800}
          label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
          input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px Archivo,sans-serif}
          input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
          .row{display:flex;gap:8px;align-items:center}
          .row>*{flex:1}.row>.fit{flex:none}
          button.b{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:12px 14px;font:800 15px Archivo,sans-serif}
          button.b.s{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
          button.b.d{background:transparent;border:1px solid var(--bad);color:var(--bad);font-weight:600}
          button.b.big{width:100%;padding:15px;font-size:17px}
          .line{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
          .line:first-of-type{border-top:0}
          .line .n{flex:1;min-width:0}.line .n b{display:block;overflow-wrap:anywhere}
          .line small,.mut{color:var(--mut);font-size:13px}
          .qty{display:flex;align-items:center;gap:6px}
          .qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:800 18px Archivo,sans-serif}
          .qty span{min-width:26px;text-align:center;font-weight:800}
          .amt{min-width:84px;text-align:right;font-weight:600}
          .total{display:flex;justify-content:space-between;font-size:24px;font-weight:800;padding-top:10px;border-top:2px solid var(--ink);margin-top:6px}
          .warn{color:var(--bad);font-size:12px}
          #scanbox{display:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);z-index:4;background:#000;padding:8px}
          #scanbox .row{margin-top:8px}
          #reader{width:100%}
          #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;z-index:30;display:none;max-width:90%;text-align:center}
          #toast.bad{background:var(--bad);color:#fff}
          #ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;overflow:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
          .ticket{background:#fff;color:#111;max-width:420px;margin:0 auto;border-radius:6px;padding:18px}
          .ticket h3{margin:0;font-size:20px;text-align:center}
          .ticket table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
          .ticket td,.ticket th{padding:4px 2px;border-bottom:1px dashed #bbb;text-align:left}
          .ticket td:nth-child(n+2),.ticket th:nth-child(n+2){text-align:right}
          .ticket .t{display:flex;justify-content:space-between;font-weight:800;font-size:20px}
          .acts{max-width:420px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap}.acts button{flex:1}
          @media print{body>*:not(#ov){display:none!important}#ov{position:static;background:none;padding:0}.acts{display:none}}
          @media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
          </style>
          </head>
          <body>
          <header><h1>Barra del salón</h1>
          <nav><button data-tab="fiesta">Fiesta</button><button data-tab="prod">Productos</button><button data-tab="hist">Historial</button></nav></header>
          <div id="scanbox"><div id="reader"></div><div class="row"><button class="b s" id="stopscan">Cerrar cámara</button></div></div>
          <main id="app"></main>
          <div id="toast"></div>
          <div id="ov"></div>
          <script src="html5-qrcode.min.js"></script>
          <script>
          var KEY='barra-salon-v1';
          var S={products:{},party:null,remitos:[],seq:1};
          try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.products)S=p}}catch(e){}
          function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en el teléfono',1)}autoSave()}
          var tab='fiesta',draft={code:'',name:'',price:'',stock:''},editing=false;
          var $=function(s){return document.querySelector(s)};
          var money=function(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n||0)};
          function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
          var tt;function toast(m,bad){var t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(function(){t.style.display='none'},1800)}
          function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(function(){o.stop();c.close()},90);if(navigator.vibrate)navigator.vibrate(40)}catch(e){}}

          function backupFile(){
            var t=JSON.stringify(S),d=new Date().toISOString().slice(0,10);
            var f=new File([t],'barra-salon-respaldo-'+d+'.json',{type:'application/json'});
            if(navigator.canShare&&navigator.canShare({files:[f]})){
              navigator.share({files:[f],title:'Respaldo Barra del salón'}).then(function(){S.lastBackup=Date.now();save();render();toast('Respaldo guardado')}).catch(function(){});
            }else if(navigator.clipboard){
              navigator.clipboard.writeText(t).then(function(){S.lastBackup=Date.now();save();render();toast('Este navegador no comparte archivos. Respaldo copiado como texto.')}).catch(function(){toast('No se pudo respaldar',1)});
            }else toast('Este navegador no permite respaldar',1);
          }
          function restoreText(v){try{var o=JSON.parse(v);if(!o.products)throw 0;if(confirm('Esto reemplaza los datos actuales. ¿Seguir?')){S=o;save();render();toast('Datos restaurados')}}catch(x){toast('El respaldo no es válido',1)}}
          function bkNote(){
            if(!Object.keys(S.products).length)return '';
            var old=!S.lastBackup||Date.now()-S.lastBackup>7*864e5;
            return old?'<div class="card" style="border-color:var(--acc)"><b>Sin respaldo reciente</b><p class="mut" style="margin:4px 0 10px">Guardá una copia de tus datos fuera del navegador.</p><button class="b s" data-act="backup">Guardar respaldo</button></div>':'';
          }
          try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

          var fst,fsWarned=0;
          function FS(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem}
          function fsWrite(path,data){
            var f=FS();if(!f)return Promise.resolve(true);
            return f.writeFile({path:'BarraSalon/'+path,data:data,directory:'DOCUMENTS',encoding:'utf8',recursive:true}).then(function(){return true}).catch(function(){return false});
          }
          function autoSave(){clearTimeout(fst);fst=setTimeout(function(){fsWrite('respaldo.json',JSON.stringify(S)).then(function(ok){if(!ok&&!fsWarned){fsWarned=1;toast('No pude guardar en la carpeta Documentos',1)}})},500)}
          function fsInit(){
            var f=FS();if(!f)return;
            var go=function(){f.readFile({path:'BarraSalon/respaldo.json',directory:'DOCUMENTS',encoding:'utf8'}).then(function(r){var o=JSON.parse(r.data);if(o&&o.products&&!Object.keys(S.products).length&&Object.keys(o.products).length){S=o;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();toast('Datos recuperados de Documentos')}}).catch(function(){})};
            try{f.requestPermissions().then(go).catch(go)}catch(e){go()}
          }
          /* ---- escáner ---- */
          var scanner=null,scanCtx=null,lastC='',lastT=0;
          function startScan(ctx){
            scanCtx=ctx;stopScan(true);$('#scanbox').style.display='block';
            if(typeof Html5Qrcode==='undefined'){toast('No cargó el lector. Usá el código manual.',1);return}
            var F=Html5QrcodeSupportedFormats;
            scanner=new Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.QR_CODE],useBarCodeDetectorIfSupported:true,verbose:false});
            scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},onScan,function(){}).catch(function(){toast('No se pudo abrir la cámara. Revisá el permiso.',1);$('#scanbox').style.display='none'});
          }
          function stopScan(keepBox){
            var s=scanner;scanner=null;
            if(s){s.stop().then(function(){s.clear()}).catch(function(){})}
            if(!keepBox)$('#scanbox').style.display='none';
          }
          function onScan(code){
            if(!scanner)return;
            beep();stopScan();
            if(scanCtx==='prod'){draft.code=code;render();toast('Código leído: '+code)}
            else addCode(code);
          }
          $('#stopscan').onclick=function(){stopScan()};

          /* ---- lógica ---- */
          function addCode(code,d){
            d=d||1;code=String(code).trim();if(!code||!S.party)return;
            var pr=S.products[code];
            if(!pr){toast('Código '+code+' no está cargado',1);if(confirm('El código '+code+' no está cargado. ¿Cargarlo ahora?')){draft={code:code,name:'',price:'',stock:''};stopScan();tab='prod';render()}return}
            var q=(S.party.items[code]||0)+d;
            if(q<=0)delete S.party.items[code];else S.party.items[code]=q;
            save();render();if(d>0)toast(pr.name+' ×'+q);
          }
          function lines(items){return Object.keys(items).map(function(c){var p=S.products[c]||{name:c,price:0};return{code:c,name:p.name,price:p.price,qty:items[c]}})}
          function closeParty(){
            var ls=lines(S.party.items);
            if(!ls.length){toast('No hay consumos cargados',1);return}
            var total=ls.reduce(function(a,l){return a+l.price*l.qty},0);
            if(!confirm('¿Cerrar la fiesta y generar el remito por '+money(total)+'? Se descuenta el stock.'))return;
            ls.forEach(function(l){var p=S.products[l.code];if(p)p.stock=Math.max(0,(p.stock||0)-l.qty)});
            var r={n:S.seq++,date:new Date().toLocaleString('es-AR'),name:S.party.name,lines:ls,total:total};
            S.remitos.unshift(r);S.party=null;save();fsWrite('remito-'+String(r.n).padStart(4,'0')+'.txt',remitoText(r));stopScan();render();showRemito(r);
          }
          function remitoText(r){
            return 'REMITO N° '+String(r.n).padStart(4,'0')+'\n'+r.name+'\n'+r.date+'\n\n'+r.lines.map(function(l){return l.qty+' x '+l.name+' ('+money(l.price)+') = '+money(l.price*l.qty)}).join('\n')+'\n\nTOTAL: '+money(r.total);
          }
          var curR=null;
          function showRemito(r){
            curR=r;
            $('#ov').innerHTML='<div class="ticket"><h3>Remito N° '+String(r.n).padStart(4,'0')+'</h3><div class="mut" style="text-align:center;color:#555">'+esc(r.name)+'<br>'+esc(r.date)+'</div><table><tr><th>Producto</th><th>Cant.</th><th>P. unit.</th><th>Subtotal</th></tr>'+
            r.lines.map(function(l){return '<tr><td>'+esc(l.name)+'</td><td>'+l.qty+'</td><td>'+money(l.price)+'</td><td>'+money(l.price*l.qty)+'</td></tr>'}).join('')+
            '</table><div class="t"><span>TOTAL</span><span>'+money(r.total)+'</span></div></div>'+
            '<div class="acts"><button class="b" data-act="print">Imprimir</button><button class="b" data-act="share">Compartir</button><button class="b" data-act="backup">Respaldar datos</button><button class="b s" style="background:#fff" data-act="closeov">Cerrar</button></div>';
            $('#ov').style.display='block';
          }

          /* ---- vistas ---- */
          function render(){
            document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
            var h='';
            if(tab==='fiesta')h=vFiesta();else if(tab==='prod')h=vProd();else h=vHist();
            $('#app').innerHTML=h;
          }
          function vFiesta(){
            if(!S.party)return bkNote()+'<div class="card"><h2>Nueva fiesta</h2><label for="pn">Nombre del evento o cliente</label><input id="pn" placeholder="Ej: Cumple de Martina"><div style="height:12px"></div><button class="b big" data-act="start">Iniciar fiesta</button></div>'+(Object.keys(S.products).length?'':'<p class="mut">Primero cargá tus bebidas en la pestaña Productos.</p>');
            var ls=lines(S.party.items),total=ls.reduce(function(a,l){return a+l.price*l.qty},0);
            var h='<div class="card"><h2>'+esc(S.party.name)+'</h2><button class="b big" data-act="scanparty">Escanear bebida</button><label for="man">O ingresá el código (o usá un lector bluetooth)</label><div class="row"><input id="man" inputmode="numeric" placeholder="Código de barras"><button class="b s fit" data-act="manual">Sumar</button></div></div>';
            h+='<div class="card"><h2>Consumo</h2>';
            if(!ls.length)h+='<p class="mut">Todavía no escaneaste nada.</p>';
            ls.forEach(function(l){var st=(S.products[l.code]||{}).stock||0;
              h+='<div class="line"><div class="n"><b>'+esc(l.name)+'</b><small>'+money(l.price)+' c/u</small>'+(l.qty>st?'<div class="warn">Stock cargado: '+st+'</div>':'')+'</div><div class="qty"><button data-act="dec" data-c="'+esc(l.code)+'" aria-label="Restar">−</button><span>'+l.qty+'</span><button data-act="inc" data-c="'+esc(l.code)+'" aria-label="Sumar">+</button></div><div class="amt">'+money(l.price*l.qty)+'</div></div>'});
            h+='<div class="total"><span>Total</span><span>'+money(total)+'</span></div></div>';
            h+='<button class="b big" data-act="close">Cerrar y generar remito</button><div style="height:10px"></div><button class="b d big" data-act="cancel">Cancelar fiesta</button>';
            return h;
          }
          function vProd(){
            var cs=Object.keys(S.products).sort(function(a,b){return S.products[a].name.localeCompare(S.products[b].name)});
            var h='<div class="card"><h2>'+(editing?'Editar producto':'Agregar producto')+'</h2><label for="pc">Código de barras</label><div class="row"><input id="pc" inputmode="numeric" value="'+esc(draft.code)+'"'+(editing?' readonly':'')+'>'+(editing?'':'<button class="b s fit" data-act="scanprod">Escanear</button>')+'</div><label for="pnm">Nombre</label><input id="pnm" value="'+esc(draft.name)+'" placeholder="Ej: Coca-Cola 2,25 L"><div class="row"><div><label for="ppr">Precio</label><input id="ppr" inputmode="decimal" value="'+esc(draft.price)+'"></div><div><label for="pst">Stock</label><input id="pst" inputmode="numeric" value="'+esc(draft.stock)+'"></div></div><div style="height:12px"></div><button class="b big" data-act="saveprod">Guardar producto</button></div>';
            h+='<div class="card"><h2>Stock ('+cs.length+')</h2>';
            if(!cs.length)h+='<p class="mut">Todavía no cargaste productos.</p>';
            cs.forEach(function(c){var p=S.products[c];h+='<div class="line"><div class="n"><b>'+esc(p.name)+'</b><small>'+esc(c)+' · Stock: '+p.stock+'</small></div><div class="amt">'+money(p.price)+'</div><button class="b s fit" data-act="edit" data-c="'+esc(c)+'">Editar</button></div>'});
            h+='</div><div class="card"><h2>Respaldo</h2><p class="mut">'+(S.lastBackup?'Último respaldo: '+new Date(S.lastBackup).toLocaleString('es-AR'):'Todavía no hiciste ningún respaldo.')+'</p><button class="b big" data-act="backup">Guardar respaldo en un archivo</button><div style="height:8px"></div><div class="row"><button class="b s" data-act="pickfile">Restaurar desde archivo</button><button class="b s" data-act="restore">Pegar texto</button></div><input type="file" id="rf" accept=".json,application/json" style="display:none"></div>';
            return h;
          }
          function vHist(){
            if(!S.remitos.length)return '<p class="mut">Cuando cierres una fiesta, el remito aparece acá.</p>';
            return '<div class="card"><h2>Remitos</h2>'+S.remitos.map(function(r,i){return '<div class="line"><div class="n"><b>N° '+String(r.n).padStart(4,'0')+' · '+esc(r.name)+'</b><small>'+esc(r.date)+'</small></div><div class="amt">'+money(r.total)+'</div><button class="b s fit" data-act="view" data-i="'+i+'">Ver</button></div>'}).join('')+'</div>';
          }

          /* ---- eventos ---- */
          document.querySelector('nav').onclick=function(e){var t=e.target.dataset.tab;if(t){tab=t;stopScan();render()}};
          $('#ov').onclick=function(e){
            var a=e.target.dataset.act;if(!a)return;
            if(a==='closeov')$('#ov').style.display='none';
            if(a==='print')window.print();
            if(a==='backup')backupFile();
            if(a==='share'){var t=remitoText(curR);if(navigator.share){navigator.share({title:'Remito',text:t}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('Remito copiado')}).catch(function(){toast('No se pudo copiar',1)})}}
          };
          $('#app').onclick=function(e){
            var el=e.target.closest('[data-act]');if(!el)return;var a=el.dataset.act,c=el.dataset.c;
            if(a==='start'){var n=$('#pn').value.trim();if(!n){toast('Poné un nombre para la fiesta',1);return}S.party={name:n,items:{}};save();render()}
            else if(a==='scanparty')startScan('party');
            else if(a==='manual'){var i=$('#man');addCode(i.value);var j=$('#man');if(j){j.value='';j.focus()}}
            else if(a==='inc')addCode(c,1);
            else if(a==='dec')addCode(c,-1);
            else if(a==='close')closeParty();
            else if(a==='cancel'){if(confirm('¿Cancelar la fiesta? Se pierde el consumo cargado.')){S.party=null;save();stopScan();render()}}
            else if(a==='scanprod'){draft.name=$('#pnm').value;draft.price=$('#ppr').value;draft.stock=$('#pst').value;startScan('prod')}
            else if(a==='saveprod'){
              var code=$('#pc').value.trim(),name=$('#pnm').value.trim(),price=parseFloat(String($('#ppr').value).replace(',','.')),stock=parseInt($('#pst').value,10);
              if(!code||!name||isNaN(price)){toast('Completá código, nombre y precio',1);return}
              S.products[code]={code:code,name:name,price:price,stock:isNaN(stock)?0:stock};save();
              draft={code:'',name:'',price:'',stock:''};editing=false;render();toast('Producto guardado')}
            else if(a==='edit'){var p=S.products[c];draft={code:c,name:p.name,price:String(p.price),stock:String(p.stock)};editing=true;render();window.scrollTo(0,0)}
            else if(a==='view')showRemito(S.remitos[+el.dataset.i]);
            else if(a==='backup')backupFile();
            else if(a==='pickfile'){var rf=$('#rf');if(rf)rf.click()}
            else if(a==='restore'){var v=prompt('Pegá acá el respaldo');if(v)restoreText(v)}
          };
          $('#app').addEventListener('change',function(e){if(e.target.id==='rf'&&e.target.files[0]){var r=new FileReader();r.onload=function(){restoreText(String(r.result))};r.readAsText(e.target.files[0])}});
          $('#app').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='man'){addCode(e.target.value);var j=$('#man');if(j){j.value='';j.focus()}}});
          render();fsInit();
          </script>
          </body>
          </html>
          EOF
